# Alembic 配置
# 注意：sqlalchemy.url 在 alembic/env.py 中从 app.core.config（.env）读取，
# 此处留空，避免数据库凭据在两处维护。

[alembic]
# 迁移脚本目录（相对路径，从项目根目录运行 alembic 命令）
script_location = alembic
# 新迁移文件命名：日期_版本号_描述
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# 把项目根目录加入 sys.path，使 env.py 可以 import app 包
prepend_sys_path = .
version_path_separator = os

# 实际连接串由 env.py 注入，此处占位
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

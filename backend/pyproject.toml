[project]
name = "campus-market-backend"
version = "0.1.0"
description = "校园二手交易平台后端（FastAPI + SQLAlchemy 2.0 + LangChain）"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/ai/chains/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
# 先只启用 pyflakes 级规则（未定义/未使用导入），保证 CI 能稳定拦住真实错误；
# 后续可逐步加 I/UP/B 并统一格式化。
select = ["F"]
ignore = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"